<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Déchiffrer un mot de passe</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6f8;
      --card: #ffffff;
      --text: #17202a;
      --muted: #667085;
      --border: #d0d5dd;
      --primary: #175cd3;
      --primary-hover: #1849a9;
      --success-bg: #ecfdf3;
      --success-border: #abefc6;
      --success-text: #067647;
      --error-bg: #fef3f2;
      --error-border: #fecdca;
      --error-text: #b42318;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 760px;
    }

    .card {
      background: var(--card);
      border: 1px solid #e4e7ec;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(16, 24, 40, 0.08);
      overflow: hidden;
    }

    .header {
      padding: 28px 30px 22px;
      border-bottom: 1px solid #eaecf0;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 24px;
      line-height: 1.2;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .content {
      padding: 28px 30px 30px;
    }

    .field {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 7px;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 11px 12px;
      font: inherit;
      font-size: 14px;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
      background: #fff;
      color: var(--text);
    }

    textarea {
      resize: vertical;
      min-height: 92px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    input:focus,
    textarea:focus {
      border-color: #84adff;
      box-shadow: 0 0 0 3px rgba(47, 128, 237, 0.12);
    }

    .hint {
      color: var(--muted);
      font-size: 12px;
      margin-top: 6px;
      line-height: 1.45;
    }

    .password-wrap {
      position: relative;
    }

    .password-wrap input {
      padding-right: 92px;
    }

    .toggle {
      position: absolute;
      right: 7px;
      top: 50%;
      transform: translateY(-50%);
      border: 0;
      background: transparent;
      color: var(--primary);
      cursor: pointer;
      font-weight: 600;
      padding: 6px 8px;
    }

    .advanced {
      margin: 2px 0 20px;
      border: 1px solid #eaecf0;
      border-radius: 10px;
      background: #fcfcfd;
    }

    .advanced summary {
      cursor: pointer;
      padding: 12px 14px;
      font-weight: 600;
      font-size: 13px;
      color: #344054;
    }

    .advanced-body {
      padding: 0 14px 14px;
    }

    .config {
      background: #f8fafc;
      border: 1px solid #e4e7ec;
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 20px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      line-height: 1.55;
      color: #344054;
      overflow-x: auto;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button.primary,
    button.secondary {
      border: 0;
      border-radius: 9px;
      padding: 11px 16px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s, opacity .15s;
    }

    button.primary {
      background: var(--primary);
      color: white;
    }

    button.primary:hover {
      background: var(--primary-hover);
    }

    button.secondary {
      background: #f2f4f7;
      color: #344054;
    }

    button:disabled {
      cursor: wait;
      opacity: .65;
    }

    .result {
      display: none;
      margin-top: 22px;
      border-radius: 10px;
      padding: 14px;
      border: 1px solid;
    }

    .result.success {
      display: block;
      background: var(--success-bg);
      border-color: var(--success-border);
      color: var(--success-text);
    }

    .result.error {
      display: block;
      background: var(--error-bg);
      border-color: var(--error-border);
      color: var(--error-text);
    }

    .result-title {
      font-weight: 700;
      margin-bottom: 7px;
    }

    .result-value {
      white-space: pre-wrap;
      word-break: break-all;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: #101828;
      background: rgba(255,255,255,.65);
      padding: 10px;
      border-radius: 7px;
      margin-top: 8px;
    }

    .copy-row {
      margin-top: 10px;
    }

    .footer-note {
      margin-top: 16px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    @media (max-width: 600px) {
      body { padding: 12px; }
      .header, .content { padding-left: 20px; padding-right: 20px; }
    }
  </style>
</head>
<body>
  <main class="container">
    <section class="card">
      <header class="header">
        <h1>Déchiffrer un mot de passe</h1>
        <p class="subtitle">
          Le déchiffrement est réalisé entièrement dans votre navigateur.
          La clé, les données chiffrées et le résultat restent sur votre poste et ne sont transmis à aucun serveur.
        </p>
      </header>

      <div class="content">
<div class="field">
          <label for="ciphertext">Mot de passe chiffré</label>
          <textarea
            id="ciphertext"
            placeholder="Coller ici la valeur chiffrée en Base64..."
            autocomplete="off"
            spellcheck="false"
          ></textarea>
          <div class="hint">
            Collez ici la valeur chiffrée qui vous a été fournie.
          </div>
        </div>

        <div class="field">
          <label for="secret">Clé</label>
          <div class="password-wrap">
            <input
              type="password"
              id="secret"
              placeholder="Saisir la clé de déchiffrement..."
              autocomplete="off"
            />
            <button type="button" class="toggle" id="toggleSecret">Afficher</button>
          </div>
        </div>
<div class="actions">
          <button type="button" class="primary" id="decryptBtn">Déchiffrer</button>
          <button type="button" class="secondary" id="clearBtn">Effacer</button>
        </div>

        <div id="result" class="result" role="status" aria-live="polite"></div>
</div>
    </section>
  </main>

  <script>
    const CRYPTO_CONFIG = {
      alg: "AES-GCM",
      kdf: "PBKDF2",
      hash: "SHA-256",
      saltBase64: "NEvY7rTqyz1DtNs/ZzURgg==",
      ivBase64: "NXBdrXLAVt4olZMF",
      iterations: 150000,
      aesKeyLength: 256,
      tagLength: 128
    };

    const ciphertextEl = document.getElementById("ciphertext");
    const secretEl = document.getElementById("secret");
    const resultEl = document.getElementById("result");
    const decryptBtn = document.getElementById("decryptBtn");
    const clearBtn = document.getElementById("clearBtn");
    const toggleSecret = document.getElementById("toggleSecret");

    function base64ToBytes(base64) {
      const normalized = base64
        .trim()
        .replace(/\s+/g, "")
        .replace(/-/g, "+")
        .replace(/_/g, "/");

      const padded = normalized + "=".repeat((4 - normalized.length % 4) % 4);
      const binary = atob(padded);
      const bytes = new Uint8Array(binary.length);

      for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
      }

      return bytes;
    }


    async function deriveAesKey(secret) {
      const encoder = new TextEncoder();

      const keyMaterial = await crypto.subtle.importKey(
        "raw",
        encoder.encode(secret),
        { name: "PBKDF2" },
        false,
        ["deriveKey"]
      );

      return crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: base64ToBytes(CRYPTO_CONFIG.saltBase64),
          iterations: CRYPTO_CONFIG.iterations,
          hash: CRYPTO_CONFIG.hash
        },
        keyMaterial,
        {
          name: "AES-GCM",
          length: CRYPTO_CONFIG.aesKeyLength
        },
        false,
        ["decrypt"]
      );
    }

    function showError(message) {
      resultEl.className = "result error";
      resultEl.innerHTML = `
        <div class="result-title">Échec du déchiffrement</div>
        <div>${escapeHtml(message)}</div>
      `;
    }

    function showSuccess(plaintext) {
      resultEl.className = "result success";
      resultEl.innerHTML = `
        <div class="result-title">Résultat</div>
        <div class="result-value" id="plaintextValue"></div>
        <div class="copy-row">
          <button type="button" class="secondary" id="copyBtn">Copier</button>
        </div>
      `;

      document.getElementById("plaintextValue").textContent = plaintext;

      document.getElementById("copyBtn").addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(plaintext);
          document.getElementById("copyBtn").textContent = "Copié";
          setTimeout(() => {
            const button = document.getElementById("copyBtn");
            if (button) button.textContent = "Copier";
          }, 1200);
        } catch {
          showError("Impossible de copier automatiquement le résultat.");
        }
      });
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    async function decryptPassword() {
      const encryptedBase64 = ciphertextEl.value.trim();
      const secret = secretEl.value;

      resultEl.className = "result";
      resultEl.innerHTML = "";

      if (!encryptedBase64) {
        showError("Saisis le mot de passe chiffré.");
        return;
      }

      if (!secret) {
        showError("Saisissez la clé de déchiffrement.");
        return;
      }

      decryptBtn.disabled = true;
      decryptBtn.textContent = "Déchiffrement…";

      try {
        let encryptedBytes = base64ToBytes(encryptedBase64);

        if (encryptedBytes.length <= 16) {
          throw new Error(
            "La valeur chiffrée semble invalide ou incomplète."
          );
        }

        const aesKey = await deriveAesKey(secret);

        const decryptedBuffer = await crypto.subtle.decrypt(
          {
            name: CRYPTO_CONFIG.alg,
            iv: base64ToBytes(CRYPTO_CONFIG.ivBase64),
            tagLength: CRYPTO_CONFIG.tagLength
          },
          aesKey,
          encryptedBytes
        );

        const plaintext = new TextDecoder("utf-8", { fatal: true }).decode(decryptedBuffer);
        showSuccess(plaintext);
      } catch (error) {
        console.error(error);

        if (error instanceof DOMException && error.name === "OperationError") {
          showError(
            "Impossible de déchiffrer la valeur. Vérifiez la clé et le mot de passe chiffré."
          );
        } else {
          showError(error.message || "Une erreur inattendue est survenue.");
        }
      } finally {
        decryptBtn.disabled = false;
        decryptBtn.textContent = "Déchiffrer";
      }
    }

    decryptBtn.addEventListener("click", decryptPassword);

    clearBtn.addEventListener("click", () => {
      ciphertextEl.value = "";
      secretEl.value = "";
      resultEl.className = "result";
      resultEl.innerHTML = "";
      ciphertextEl.focus();
    });

    toggleSecret.addEventListener("click", () => {
      const visible = secretEl.type === "text";
      secretEl.type = visible ? "password" : "text";
      toggleSecret.textContent = visible ? "Afficher" : "Masquer";
    });

    secretEl.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        decryptPassword();
      }
    });
  </script>
</body>
</html>
